#-----------------------------------------------------------------------------------
#
# redshift grid
#
#-----------------------------------------------------------------------------------

nzpts  = 10000          # number of redshift points.
                       # For range z = 50-3000, nz=500 is in principle sufficient.
                       # With spectral distortions >=2500 is recommended
zstart = 4500          # starting redshift; above z=3400 the Recfast++ Solution
                       # should be used. This is automatically done in batch mode.
zend   = 0.0           # ending redshift; below z=50 the Recfast++ system is solved
                       # with rescaled dXe/dt

#-----------------------------------------------------------------------------------
#
# cosmological parameters for Cosmos-object
# For the energy densities, you can give 'Omega_i' or 'omega_i' == omega_i * h^2
# Please don't specify both otherwise the code won't run
#
#-----------------------------------------------------------------------------------

T0      = 2.726        # Present CMB temperature in Kelvin
Yp      = 0.24         # Helium mass fraction
N_eff   = 3.046        # Effective number of relativistic species

Omega_m = 0.26         # total matter density (Omega_cdm + Omega_b) (deprecated)
#Omega_cdm = 0.1193     # cold dark matter density
Omega_b = 0.044        # baryon density
Omega_L = 0.0          # (if <=0 it will be computed from the other variables)
Omega_k = 0.0          # curvature

h100    = 0.71         # reduced Hubble parameters H0 / [100 km s^-1 Mpc^-1]


#-----------------------------------------------------------------------------------
#
# CosmoRec specific settings
#
#-----------------------------------------------------------------------------------

#-----------------------------------------------------------------------------------
# settings for Hydrogen recombination problem and PDE
#-----------------------------------------------------------------------------------

number of hydrogen shells = 3    # currently: 3, 4, 5 or 10; lite only 3

nS for effective HI rates = 500  # nS=10, 20, 50, 100, 128, 200, 300, 400 and 500;
                                 # CosmoRec-lite only 500
                                 # If the number of hydrogen shells is !=3, only
                                 # effective rates for nS=500 are available.

run HI PDE part = 1              # if == 0 only the initial calculation without
                                 # transfer corrections will be performed

correction to 2s-1s channel = 2  # 0: no corr; 1: stim. 2s-1s; 2: full correction;

nS two-photon decays = 3         # nS up to which two-photon effects are considered.
                                 # If set to <3 then only the diffusion correction
                                 # is included.

nS Raman-scattering = 2          # nS up to which Raman-scattering is considered.
                                 # If set to <2 then the 1+1 Raman rates are not
                                 # corrected.

#-----------------------------------------------------------------------------------
# settings for HeI recombination problem and PDE
#-----------------------------------------------------------------------------------

number of helium shells = 3      # currently: 2, 3, 5 or 10; lite only 2 & 3

nS for effective HeI rates = 500 # nS=100, 200 and 500

HI absorption = 2                # HI absorption during HeI-recombination
                                 # 0: off
                                 # 1: on using approximations of RCS 2008
                                 # 2: on with Diffusion fudge
                                 # 3: radiative transfer code
                                 # 4: also including HeII feedback

spin forbidden transitions = 0   # add spin forbidden transitions for
                                 # HeI-recombination (0: off; 1: on)

HeI feedback setting = 0         # Feedback among Helium levels
                                 # positive: no HI abs between the lines
                                 # negative: with HI abs between the lines

#-----------------------------------------------------------------------------------
#
# recombination physics settings
#
#-----------------------------------------------------------------------------------

Recfast fudge factor = 0         # mainly affects freeze-out tail
                                 # (F>=0, F==0 --> set to recfast default == 1.14)

include correction function = 1  # include Chluba & Thomas 2010 correction function
                                 # to mimic the full CosmoRec output

A2s1s = 8.2206                   # A2s1s decay rate for hydrogen. If ==0 internal
                                 # default is used, which is A2s1s=8.22458 s^-1

#-----------------------------------------------------------------------------------
# annihilating particles          (Chluba, 2010, MNRAS, 402, 1195-1207)
#-----------------------------------------------------------------------------------

f_ann = 0.0e-24         # in eV s^-1. Should be >=0.
                        # Values < 1.0e-25 - 1.0e-24 are compatible with Planck 2015.
                        # This defines the energy input per hydrogen atom.
                        # Values <= 10^-23 eV/sec are recommended. For larger values
                        # the CosmoRec calculation breaks down. In Recfast-mode also
                        # larger values are possible (see Chluba 2010 for details).

#-----------------------------------------------------------------------------------
# decaying particles
#-----------------------------------------------------------------------------------

f_dec     = 0.0e-10           # fraction of dark matter that is decaying [ > 0 ]
Gamma_dec = 0.0e-15           # decay rate in 1/sec
                              # in CosmoRec mode f_dec < 1.0e-10

#-----------------------------------------------------------------------------------
# primordial magnetic fields    (Chluba et al., 2015, MNRAS, 451, 2244)
#-----------------------------------------------------------------------------------

B0 =  0.0               # B0 is magnetic field amplitude in nG
                        # if ==0 --> effects off
nB = -2.9               # nB == spectral index of PMF
                        # (nB=-2.9 <--> scale-invariant case)

include turbulent decay     = 1     # one has to be !=0
include ambipolar diffusion = 0     # one has to be !=0
Paoletti and Finelli norm   = 0     # uses norm in terms of B_lambda

#-----------------------------------------------------------------------------------
# variation of fundamental constants (Hart & Chluba, 2017, 474, 1850-1861)
#-----------------------------------------------------------------------------------

alp/alp_ref       = 1.0        # no rescaling for <=0; value ignored when mode==0
me/me_ref         = 1.0        # no rescaling for <=0; value ignored when mode==0
power for (1+z)^p = 0.0        # value ignored when mode==0
                               # [only Recfast++ mode, but ignored in CosmoRec]

Variation mode    = 0          # 0 - no rescaling
                               # 1 - Rescaling of Boltzmann factor exponentials
                               #     (i.e., temperatures)
                               # 2 - Rescaling of Thomson scattering cross section
                               # 3 - Rescaling of 2s1s 2 photon rate
                               # 4 - Rescaling of alpha and beta co-efficients
                               # 5 - Rescaling of Ly-a channel
                               # 6 - Rescale everything

#-----------------------------------------------------------------------------------
#
# CosmoRec outputs
#
#-----------------------------------------------------------------------------------

write_Xe_Te_sol      = 1    # Xe & Te [default on]
write_cosmology      = 0    # info about the background cosmology
write_populations    = 0    # solution for the populations of the resolved states
write_correction_fun = 0    # correction functions from Recfast++ and CosmoRec
write_HI_distortion  = 0    # approximate HI distortion from CosmoRec only
write_split          = 0    # split Xe for H and He correction functions
write_RF_visibility  = 0    # Thomson visibility function in RF mode

#-----------------------------------------------------------------------------------
#
# settings for spectral distortion part.
#
#-----------------------------------------------------------------------------------
# HI distortion is always computed, if mode is activated.

compute HeI distortions   = 1
compute HeII distortions  = 0

include HI e-scattering   = 0
include HeI e-scattering  = 0
include HeII e-scattering = 1

#-----------------------------------------------------------------------------------
#
# Path and mame extension for output
#
#-----------------------------------------------------------------------------------

show movie Grace HI         = 1             # output HI diffusion movie using Grace
show movie Grace HeI        = 1             # output HeI diffusion movie using Grace

verbosity level CosmoRec    = 0             # <0 absolute silence. More info for >=0
path for output             = ./outputs.tests/
addition to name for output = .debug.dat

#-----------------------------------------------------------------------------------
#-----------------------------------------------------------------------------------
